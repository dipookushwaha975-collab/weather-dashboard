<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <div class="header-controls">
                <button id="locationBtn" class="btn-icon" title="Current Location">
                    <i class="fas fa-location-dot"></i>
                </button>
                <button id="unitToggle" class="btn-unit">°C</button>
            </div>
        </header>

        <main>
            <!-- Search Section -->
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search for a city..." />
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <div id="suggestionsList" class="suggestions-list hidden"></div>
            </div>

            <!-- Loading State -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </div>

            <!-- Error State -->
            <div id="errorMessage" class="error-message hidden"></div>

            <!-- Current Weather Section -->
            <div id="currentWeather" class="current-weather hidden">
                <div class="weather-card">
                    <div class="city-info">
                        <h2 id="cityName"></h2>
                        <p id="weatherDate"></p>
                    </div>
                    <div class="weather-main">
                        <img id="weatherIcon" src="" alt="Weather Icon">
                        <div class="temp-info">
                            <span id="temperature" class="temp"></span>
                            <span id="weatherDescription" class="description"></span>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="fas fa-droplets"></i>
                            <span>Humidity: <strong id="humidity"></strong></span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-wind"></i>
                            <span>Wind: <strong id="windSpeed"></strong></span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-eye"></i>
                            <span>Visibility: <strong id="visibility"></strong></span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-gauge"></i>
                            <span>Pressure: <strong id="pressure"></strong></span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-thermometer-half"></i>
                            <span>Feels Like: <strong id="feelsLike"></strong></span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-sun"></i>
                            <span>UV Index: <strong id="uvIndex"></strong></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Hourly Forecast -->
            <div id="hourlySection" class="forecast-section hidden">
                <h3>Hourly Forecast</h3>
                <div id="hourlyForecast" class="hourly-forecast"></div>
            </div>

            <!-- 7-Day Forecast -->
            <div id="weeklySection" class="forecast-section hidden">
                <h3>7-Day Forecast</h3>
                <div id="weeklyForecast" class="weekly-forecast"></div>
            </div>

            <!-- Favorites Section -->
            <div id="favoritesSection" class="favorites-section">
                <h3>Favorite Cities</h3>
                <div id="favoritesList" class="favorites-list"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
